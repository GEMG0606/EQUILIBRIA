<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Utility Rush | Equilibria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="games.js"></script><script src="equilibria.js"></script></head>
<body><div id="hd"></div>
<div class="wrap" style="padding:24px 20px 60px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h1 style="font:700 28px Fraunces,serif;margin:0">Utility Rush</h1><button class="btn ghost" id="rl">Rules</button></div>
    <div class="card" id="play"></div>
  </div>
  <div><h2 style="margin-top:0">Leaderboard <span class="mut" style="font-size:14px;font-weight:400">live</span></h2><div class="card" id="lb"></div></div>
</div>
<script>
const ID="utility-rush", SPEC={
  title:"Utility Rush", intro:"Three rounds on how economists think. Total 1,000 points.",
  rounds:[["Round 1: Samosa Stack",400,"Three foods. Press Eat to consume one more unit and watch total utility (TU). Press Bank to lock in your current TU for that food. Each food has a hidden marginal utility curve. TU rises while marginal utility (MU) is positive and falls once MU turns negative. Your score for a food is your banked TU as a share of the best possible TU."],
    ["Round 2: Six-Hour Frontier",300,"Split six hours between study and gaming for each scenario. Find the point that best meets the scenario goal on the frontier."],
    ["Round 3: Spot the Assumption",300,"Claims appear on a timer. Tap the buried assumption. Faster answers earn a bonus, wrong taps cost points."]],
  tips:["Bank at the peak, not after it. The peak is where MU reaches zero.","Greedy play loses: eating past the peak lowers TU.","The third food has a curve that falls faster than the first two.","Every attempt uses new hidden curves, so memorising will not help."]};
const FOODS=["Samosa","Gulab Jamun","Chai"];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mu(seed,i){const r=rng(seed+i*977),f=16+Math.floor(r()*12),d=3+Math.floor(r()*3),c=i*0.35,o=[];for(let k=0;k<12;k++)o.push(Math.round(f-d*k-c*k*k));return o}
const tu=(m,n)=>m.slice(0,n).reduce((a,b)=>a+b,0);
function score(seed,acts){let s=0;for(let i=0;i<3;i++){const m=mu(seed,i),best=Math.max(...m.map((_,k)=>tu(m,k+1)));s+=Math.round(133.33*Math.max(0,tu(m,Math.min(12,acts[i]|0)))/best)}return Math.min(400,s)} // server copies this

(async()=>{
  const $=Eq.$, P=await Eq.gate(ID); if(!P)return;
  $("#hd").innerHTML=Eq.head(`<a class="btn ghost" href="index.html">All games</a>`);
  Eq.board($("#lb"),ID);
  $("#rl").onclick=()=>Eq.rules(SPEC,"Close");
  await Eq.rules(SPEC); begin();
  async function begin(){
    let att; try{att=await Eq.start(ID)}catch(e){return $("#play").innerHTML=`<p>${e.message}</p>`}
    let i=0,n=0,acts=[],M=mu(att.seed,0);
    const render=()=>{
      const last=n?M[n-1]:null;
      $("#play").innerHTML=`<div class="mut" style="font-size:13px">Attempt ${att.no} · ${att.ranked?"Ranked":"Practice, not ranked"} · Food ${i+1} of 3</div>
      <h2 style="margin:6px 0">${FOODS[i]} ${"🥟".repeat(0)}<span style="font-size:26px">${"●".repeat(n)}</span></h2>
      <div style="display:flex;gap:28px;margin:12px 0"><div><div class="mut">Total utility</div><div style="font:700 44px Fraunces">${tu(M,n)}</div></div>
      <div><div class="mut">Last marginal utility</div><div style="font:700 44px Fraunces;color:${last<0?"var(--bad)":"inherit"}">${last??"–"}</div></div></div>
      <button class="btn" id="e" ${n>=12?"disabled":""}>Eat one more</button> <button class="btn ghost" id="b">Bank it</button>`;
      $("#e").onclick=()=>{n++;render()}; $("#b").onclick=bank;
    };
    function bank(){acts.push(n);i++;n=0;if(i<3){M=mu(att.seed,i);return render()}fin()}
    async function fin(){
      const local=score(att.seed,acts); $("#play").innerHTML="<p>Submitting…</p>";
      try{const r=await Eq.finish(ID,att,acts,local);
        $("#play").innerHTML=`<h2 style="margin-top:0">Round 1 score: ${r.score} / 400</h2><p>${r.ranked?"This attempt counts toward the leaderboard.":"Practice run: not added to the leaderboard."}</p><p class="mut">Rounds 2 and 3 are added in the next build. Finishing this game unlocks Level 2.</p><button class="btn" id="a">Play again</button> <a class="btn ghost" href="index.html">Home</a>`;
        $("#a").onclick=begin}catch(e){$("#play").innerHTML=`<p>${e.message}</p>`}
    }
    render();
  }
})();
</script></body></html>
