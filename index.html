const $=(s,e=document)=>e.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),sh=a=>[...a].sort(()=>Math.random()-.5);

/* ---------- GAME 1: Utility Rush ---------- */
const CL=[
['Sales rose after the ad, so the ad worked.','Nothing else that could raise sales changed (ceteris paribus)','Ads always pay for themselves','Sales can only go up'],

G[1]={intro:'<h3>3 rounds · 1000 pts</h3><p><b>1 · Samosa Stack (400)</b> Eat to raise total utility, then bank before marginal utility turns negative. The hidden curve changes every try.<br><b>2 · Six-Hour Frontier (300)</b> Split 6 hours between study and gaming to meet each scenario.<br><b>3 · Spot the Assumption (300)</b> Tap the buried assumption. Faster is better.</p>',
play(el,done){let s1=0,s2=0;
const foods=sh([['🥟','Samosa'],['🍕','Pizza slice'],['🍦','Ice cream'],['🍜','Noodles']]).slice(0,3);let fi=0;
const food=()=>{const [em,nm]=foods[fi],u0=RI(24,40),d=R(3,6.5),mu=[];for(let i=0;i<14;i++)mu.push(Math.round(u0-d*i+R(-1.5,1.5)));
let c=0,bt=1;mu.forEach(m=>{c+=m;bt=Math.max(bt,c)});let k=0,tot=0;

const sc=()=>{if(i>=3){r3();return}el.innerHTML=`<div class="rnd">Round 2 · frontier ${i+1}/3</div><div class="claim">${S[i][0]}</div><p class="mut">You have 6 hours. Using all of them puts you <b>on</b> the frontier.</p>Study: <b id="sv">3</b>h <input type="range" id="s" min="0" max="6" value="3"><br>Gaming: <b id="gv">3</b>h <input type="range" id="g" min="0" max="6" value="3"><div id="fb"></div><button class="btn" id="ok">Lock in</button>`;

const r3=()=>{const cs=sh(CL).slice(0,6);let i=0,s3=0;const nx=()=>{if(i>=6){done(s1+s2+s3);return}const [q,ok,...bad]=cs[i],T=12000,t0=Date.now();
el.innerHTML=`<div class="rnd">Round 3 · ${i+1}/6 · tap the hidden assumption</div><div class="claim">“${q}”</div><div class="bar"><i id="bar"></i></div><div class="opts">${sh([ok,...bad]).map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;

food()}};

/* ---------- GAME 2: Chase the Equilibrium ---------- */
const LV=[[300,[['Incomes rise (pizza is a normal good)',1,0],['A viral trend makes pizza fashionable',1,0],['Cheese prices jump',0,-1],['New ovens make baking cheaper and faster',0,1],['A health scare turns people off pizza',-1,0],['A failed wheat harvest makes flour costly',0,-1],['A new college brings thousands of extra buyers',1,0]],6],

const gsvg=(dd,ds,rev)=>{const sd=dd*40,ss=ds*40,D=o=>`x1="40" y1="${40-o*2/3}" x2="280" y2="${40+(240-o)*2/3}"`,S=o=>`x1="40" y1="${200+o*2/3}" x2="280" y2="${200-(240-o)*2/3}"`,ex=160+(sd+ss)/2,ey=40+(ex-40-sd)*2/3;

G[2]={intro:'<h3>3 levels · 1000 pts</h3><p>An event hits the pizza market. Choose whether <b>demand</b> and <b>supply</b> shift left, right, or not at all (a price change is only a <i>movement</i>), then call the new <b>price</b> and <b>quantity</b>. Use <b>?</b> when the effect is ambiguous and <b>—</b> for no change. Speed earns a bonus on perfect calls.</p>',
play(el,done){let s=0,li=0,ei=0;const pools=LV.map(l=>sh(l[1]));
const w=x=>x>0?'shifts right':x<0?'shifts left':'does not shift',sym=x=>x==1?'rises':x==-1?'falls':x=='x'?'is ambiguous':'is unchanged';
const nx=()=>{if(ei>=LV[li][2]){li++;ei=0}if(li>=3){done(s);return}ev()};
const ev=()=>{const [txt,dD,dS]=pools[li][ei],base=LV[li][0]/LV[li][2],t0=Date.now(),sg=[[-1,'← Left'],[0,'No shift'],[1,'Right →']],pq=[[1,'↑'],[-1,'↓'],['x','?'],[0,'—']];
el.innerHTML=`<div class="rnd">Level ${li+1} · event ${ei+1}/${LV[li][2]} · score ${Math.round(s)}</div><div class="claim">${txt}</div><div id="gr">${gsvg(0,0,0)}</div>${LEGEND}${grp('gd','Demand',sg)}${grp('gs','Supply',sg)}${grp('gp','Price',pq)}${grp('gq','Quantity',pq)}<div id="fb"></div><button class="btn" id="ok">Lock in</button>`;grpInit(el);
$('#ok',el).onclick=function(){const a=['gd','gs','gp','gq'].map(i=>val(el,i));if(a.includes(null)){$('#fb',el).textContent='Pick an answer in every row.';return}
const pe=(!dD&&!dS)?0:(dD*-dS<0?'x':Math.sign(dD-dS)),qe=(!dD&&!dS)?0:(dD*dS<0?'x':Math.sign(dD+dS));
const c=[dD,dS,pe,qe].filter((e,i)=>String(e)==a[i]).length;s+=base*(.75*c/4+(c==4?.25*Math.max(0,1-(Date.now()-t0)/20000):0));
$('#gr',el).innerHTML=gsvg(dD,dS,1);$('#fb',el).innerHTML=`${c==4?'✅ Perfect!':'❌ '+c+'/4 right.'} Demand ${w(dD)}, supply ${w(dS)}; price ${sym(pe)}, quantity ${sym(qe)}.`;this.remove();ei++;nextBtn(el,nx)}};
nx()}};

/* ---------- GAME 3: Price Is Right? ---------- */
G[3]={intro:'<h3>5 days · 1000 pts</h3><p>Each day you sell one product with a <b>hidden</b> demand. You get <b>3 test sales</b> to learn how buyers react, then <b>commit</b> a price. Each day scores your revenue against the best possible. Some days the market changes under you.</p>',
play(el,done){const PR=[['🧂','Salt','An everyday essential.',60,200,6],['👟','Designer shoes','A luxury item.',9000,80,.6],null,['🍕','Pizza','A rival pizzeria just cut its prices by 20%!',500,150,.8,.85,.7],['🍅','Tomatoes','Bumper harvest: the market is flooded with supply!',60,200,3,.6,1.4]];
PR[2]=sh([['📱','Phone charger','Mystery product. No hints today.',800,120,2],['🍚','Rice','Mystery product. No hints today.',90,250,4.5],['🎧','Earbuds','Mystery product. No hints today.',3000,90,.7]])[0];let d=0,tot=0;
const day=()=>{if(d>=5){done(tot);return}const [em,nm,note,p,q,k,pf=1,qf=1]=PR[d],Pm=p*R(.88,1.12)*pf,Qm=q*R(.88,1.12)*qf,ref=Math.round(p*pf/2),Qf=x=>Math.max(0,Qm*(1-Math.pow(x/Pm,k)));
let best=1;for(let x=1;x<Pm;x+=Pm/300)best=Math.max(best,x*Qf(x));let left=3,log=[];
el.innerHTML=`<div class="rnd">Day ${d+1}/5 · score ${Math.round(tot)}</div><div class="food">${em}</div><h3>${nm}</h3><p class="mut">${note} Last week's price: ₹${ref}</p><div>Price: <b>₹<span id="pv">${ref}</span></b></div><input type="range" id="pr" min="${Math.round(ref*.25)}" max="${Math.round(ref*2.4)}" step="${Math.max(1,Math.round(ref/100))}" value="${ref}"><div class="row"><button class="btn ghost" id="test">Test sale (3 left)</button><button class="btn" id="com">Commit price</button></div><div id="log" class="mut"></div><div id="fb"></div>`;
$('#pr',el).oninput=()=>$('#pv',el).textContent=$('#pr',el).value;
$('#test',el).onclick=function(){const P=+$('#pr',el).value,n=Math.round(Qf(P)*(1+R(-.04,.04)));log.push(`₹${P} → ${n} sold (₹${P*n})`);left--;this.textContent=`Test sale (${left} left)`;if(!left)this.disabled=true;$('#log',el).innerHTML=log.join('<br>')};
$('#com',el).onclick=function(){const P=+$('#pr',el).value,rv=P*Math.round(Qf(P)),r=Math.min(1,rv/best),pts=200*r*r;tot+=pts;this.remove();$('#test',el).remove();$('#pr',el).disabled=true;$('#fb',el).innerHTML=`Revenue ₹${Math.round(rv)} · best possible ₹${Math.round(best)} · <b>${Math.round(r*100)}%</b> → +${Math.round(pts)} pts`;d++;nextBtn(el,day,d>=5?'Finish':'Next day →')}};day()}};

/* ---------- GAME 4: Goods Detective ---------- */
const EXP={normal:'Income up → buy more; price up → buy less.',inferior:'Income up → buy LESS; price up → buy less.',giffen:'Income up → buy less; price up → buy MORE (income effect beats substitution).',veblen:'Income up → buy more; price up → buy MORE (status good).'};
const DET=[['normal','Fresh fruit','kg'],['normal','Cinema tickets','tickets'],['inferior','Cheap instant noodles','packs'],['inferior','Third-class train tickets','trips'],['giffen','Staple rice (very poor household)','kg'],['giffen','Cheap bread (very poor household)','loaves'],['veblen','Luxury designer watch','units'],['veblen','Premium perfume','bottles']];
const MT=[['Pepsi and Coke','Substitutes'],['Tea and coffee','Substitutes'],['Cars and petrol','Complements'],['A phone and its charger','Complements'],['Salt and shoes','Independent goods'],['Rice, salt and medicines','Necessity'],['Foreign holidays and jewellery','Luxury'],['Street lighting','Public good'],['National defence','Public good'],['A samosa','Private good'],['A cable TV subscription','Club good'],['Fish in the open sea','Common resource']];
const sg=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
const quiz=(el,title,items,pts,fast,after,top,last)=>{let i=0,s=0;const nx=()=>{if(i>=items.length){after(s);return}const it=items[i],t0=Date.now();
el.innerHTML=`<div class="rnd">${title} · ${i+1}/${items.length}</div>${top||''}<div class="claim">${it.q}</div><div class="opts">${sh(it.o).map(o=>`<button class="opt">${o}</button>`).join('')}</div><div id="fb"></div>`;
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const g=b.textContent==it.ok;el.querySelectorAll('.opt').forEach(x=>{x.onclick=null;if(x.textContent==it.ok)x.classList.add('ok')});if(g)s+=pts+fast*Math.max(0,1-(Date.now()-t0)/10000);else b.classList.add('bad');
$('#fb',el).innerHTML=(g?'✅ Correct! ':'❌ Not quite. ')+it.why;i++;nextBtn(el,nx,i>=items.length?(last||'Continue →'):'Next →')})};nx()};
const mkA=()=>[0,1,2,0,2].map(t=>{
if(t==0){const x=RI(1,4),y=RI(1,3),P=x+y,c=[...new Set([P+x,P,x,y+2,-y].filter(v=>v!=y))].slice(0,3);return{q:`The samosa price falls. The <b>price effect</b> is ${sg(P)} samosas and the <b>substitution effect</b> is ${sg(x)}. What is the <b>income effect</b>?`,o:[y,...c].map(sg),ok:sg(y),why:`Income effect = price effect − substitution effect = ${P} − ${x} = ${sg(y)}.`}}
if(t==1){const x=RI(1,4),y=RI(1,3),P=x+y,c=[...new Set([x-y,y,x,P+1,P+2].filter(v=>v!=P))].slice(0,3);return{q:`The samosa price falls. The <b>substitution effect</b> is ${sg(x)} and the <b>income effect</b> is ${sg(y)}. What is the total <b>price effect</b>?`,o:[P,...c].map(sg),ok:sg(P),why:`Price effect = substitution effect + income effect = ${x} + ${y} = ${sg(P)}.`}}
const k=RI(0,2),x=RI(2,4),y=k==0?RI(1,3):k==1?-RI(1,x-1):-RI(x+1,x+3),ans=k==0?'Normal good':k==1?'Inferior (but ordinary) good':'Giffen good';
return{q:`A price falls. The <b>substitution effect</b> is ${sg(x)} and the <b>income effect</b> is ${sg(y)}. What kind of good is it?`,o:['Normal good','Inferior (but ordinary) good','Giffen good'],ok:ans,why:k==0?'Income effect is positive, so a normal good.':k==1?'Income effect is negative (inferior), but smaller than substitution, so quantity still rises: the law of demand holds.':'Income effect is negative AND bigger than substitution, so total quantity falls when price falls. That is a Giffen good.'}});
const mkB=()=>{const by={};sh(DET).forEach(d=>by[d[0]]=by[d[0]]||d);const four=Object.values(by),rest=sh(DET).filter(d=>!four.includes(d));return sh([...four,rest[0]]).map(([ty,nm,un])=>{const q=RI(8,20),f=()=>R(1.25,1.5),dn=()=>R(.65,.8),inc=ty=='normal'||ty=='veblen'?1:-1,pr=ty=='normal'||ty=='inferior'?-1:1,ch=(v,d)=>Math.max(1,Math.round(v*(d>0?f():dn())));
return{q:`${nm}<div class="stats"><div>Income +25%<b>${q}→${ch(q,inc)}</b>${un}</div><div>Price +20%<b>${q}→${ch(q,pr)}</b>${un}</div></div>Which kind of good is this?`,o:['Normal good','Inferior good','Giffen good','Veblen good'],ok:ty[0].toUpperCase()+ty.slice(1)+' good',why:EXP[ty]}})};
const HINT='<details class="hint"><summary>💡 Need a hint? (no penalty)</summary><div class="legend"><ul><li><b>Normal:</b> income ↑ buy ↑ · price ↑ buy ↓</li><li><b>Inferior:</b> income ↑ buy ↓ · price ↑ buy ↓</li><li><b>Giffen:</b> income ↑ buy ↓ · price ↑ buy ↑</li><li><b>Veblen:</b> income ↑ buy ↑ · price ↑ buy ↑</li></ul></div></details>';
const mkC=()=>{const L=[...new Set(MT.map(m=>m[1]))];return sh(MT).slice(0,6).map(([n,t])=>({q:`<b>${n}</b><br><span class="mut">Which category fits best?</span>`,o:[t,...sh(L.filter(l=>l!=t)).slice(0,3)],ok:t,why:`${n} → <b>${t}</b>.`}))};
G[4]={intro:'<h3>3 quick rounds · 1000 pts</h3><p><b>A · Effect Splitter (300)</b> Do the sums: price effect = substitution + income.<br><b>B · Goods Detective (400)</b> Read the clues and name the kind of good.<br><b>C · Match the Good (300)</b> Match everyday examples to their category.</p>',
play(el,done){quiz(el,'Round A · Effect Splitter',mkA(),60,0,a=>quiz(el,'Round B · Goods Detective',mkB(),60,20,b=>quiz(el,'Round C · Match the Good',mkC(),40,10,c=>done(a+b+c),'','Finish'),HINT),'<div class="legend"><b>Remember</b>Price effect = Substitution effect + Income effect. For a price <i>fall</i>, substitution is always <b>+</b>.</div>')}};

const LEGEND=`<div class="legend"><b>🔎 Symbol guide</b><ul><li><b style="color:#2ecc9a">D</b> = demand curve (buyers)</li><li><b style="color:#4aa3f0">S</b> = supply curve (sellers)</li><li>⚪ White dot = old equilibrium</li><li>⚪ Bright dot with green ring = new equilibrium (shown after you lock in)</li><li>Dashed lines = the original curves</li><li><b>P</b> = price · <b>Q</b> = quantity</li><li><b>← Left</b> = curve shifts left (decrease)</li><li><b>Right →</b> = curve shifts right (increase)</li><li><b>No shift</b> = curve stays where it is</li><li><b>↑</b> = rises · <b>↓</b> = falls</li><li><b>?</b> = ambiguous (depends on which shift is bigger)</li><li><b>—</b> = no change</li></ul></div>`;

G[1].rules=`<h4>General</h4><ul><li>Three rounds, <b>1000 points</b> in total. Unlimited tries: your <b>best</b> score counts, and a faster time breaks ties.</li></ul>
<h4>Round 1 · Samosa Stack (400 pts)</h4><ul><li>You get 3 foods, each worth up to about 133 pts.</li><li>Tap <b>Eat one</b> to eat another unit. Each unit adds <b>marginal utility</b> (extra satisfaction). It starts high, falls with every unit, and eventually turns <b>negative</b>.</li><li><b>Total utility</b> is the running sum of all marginal utilities. Tap <b>Bank it</b> to lock it in.</li><li>Your score = your banked total ÷ the best total possible. Bank just before marginal utility goes negative for full marks.</li><li>You can eat at most 14 units. The hidden curve is random every time.</li></ul>
<h4>Round 2 · Six-Hour Frontier (300 pts)</h4><ul><li>3 scenarios, 100 pts each. You have <b>6 hours</b> to split between studying and gaming.</li><li><b>50 pts</b> for being exactly on the frontier (study + gaming = 6). Less than 6 wastes time; more than 6 is impossible.</li><li><b>50 pts</b> for meeting the scenario's goal.</li></ul>
<h4>Round 3 · Spot the Assumption (300 pts)</h4><ul><li>6 claims, <b>12 seconds</b> each (watch the bar). Tap the hidden assumption that the claim relies on.</li><li>Correct: 25 pts + up to 25 speed bonus (more time left = more bonus). Wrong or timed out: 0.</li></ul>`;

G[2].rules=`<h4>Goal</h4><ul><li>The pizza market starts in equilibrium. An event hits. Decide how <b>demand</b> and <b>supply</b> move, then what happens to the <b>price</b> and <b>quantity</b>.</li><li>You must answer all four rows before you can lock in.</li></ul>
<h4>Thinking tools</h4><ul><li><b>Demand shifts</b> because of income, tastes, prices of related goods, expectations or number of buyers.</li><li><b>Supply shifts</b> because of input costs, technology, taxes, expectations or number of sellers.</li><li>A change in the good's <b>own price</b> is only a <i>movement along</i> a curve, so nothing shifts and the equilibrium stays put.</li><li>Only demand moves right: P↑ Q↑. Only supply moves right: P↓ Q↑. (Left shifts flip the arrows.)</li><li>If <b>both</b> curves shift in the same direction, <b>price</b> is <b>?</b> (ambiguous) and quantity moves that way. If they shift in opposite directions, <b>quantity</b> is <b>?</b> and price follows demand.</li></ul>
<h4>Scoring (1000 pts)</h4><ul><li>Level 1: 6 events, 300 pts. Level 2: 6 events, 350 pts. Level 3: 5 events with two things happening at once, 350 pts.</li><li>Each event's points are split over the 4 answers: <b>75%</b> for accuracy (equal share per correct row).</li><li>The other <b>25%</b> is a speed bonus, earned only if all 4 are right, fading to zero over 20 seconds.</li></ul>${LEGEND}`;

G[3].rules=`<h4>Goal</h4><ul><li>Run a stall for <b>5 days</b>. Each day you sell one product whose demand is hidden. Find the price that earns the <b>most revenue</b> (price × units sold).</li></ul>
<h4>Each day</h4><ul><li>Use the slider to set a price. You have <b>3 free test sales</b>: each shows how many units would sell at that price (with about ±4% noise).</li><li>When ready, tap <b>Commit price</b>. You cannot change it afterwards.</li><li>Day 3 is a mystery product. Days 4 and 5 are <b>market shocks</b> (a rival price cut, a flooded market), so yesterday's instincts may not apply.</li></ul>
<h4>Scoring (1000 pts)</h4><ul><li>Each day is worth up to 200 pts: <b>200 × (your revenue ÷ best possible revenue)²</b>. Being close to the best matters a lot.</li><li>Tip: if sales barely drop when you raise the price (inelastic), go higher. If sales drop a lot (elastic), go lower. The best price is where demand is about unit-elastic.</li></ul>`;

G[4].rules=`<h4>General</h4><ul><li>Three short rounds, <b>1000 pts</b> in total. Tap an answer to see the explanation, then continue. Unlimited tries; your best score counts and a faster time breaks ties.</li></ul>
<h4>Round A · Effect Splitter (300 pts)</h4><ul><li>5 questions, 60 pts each, no time pressure.</li><li>Use <b>Price effect = Substitution effect + Income effect</b>. Find the missing piece, the total, or the type of good.</li><li>For a price <i>fall</i> the substitution effect is always <b>+</b>. A negative income effect means an inferior good. If that negative effect is bigger than the substitution effect, it is a Giffen good.</li></ul>
<h4>Round B · Goods Detective (400 pts)</h4><ul><li>5 mystery goods. Look at how quantity bought changes when <b>income rises 25%</b> and when <b>price rises 20%</b>, then pick: Normal, Inferior, Giffen or Veblen.</li><li>Each is worth 60 pts + up to 20 for speed (full bonus at once, fading over 10 s). Open the 💡 hint for a cheat-sheet; it costs nothing.</li></ul>
<h4>Round C · Match the Good (300 pts)</h4><ul><li>6 everyday examples. Pick the best category (substitutes, complements, independent goods, necessity, luxury, public, private, club good or common resource).</li><li>Each is worth 40 pts + up to 10 for speed (fading over 10 s).</li></ul>`;

const app=$('#app'),H={apikey:CFG.KEY,'Content-Type':'application/json'};
const GAMES=[
{t:'Utility Rush',s:'Thinking Like an Economist',e:'🥟',c:'#2ecc9a',d:'Stack samosas, slide the frontier, spot hidden assumptions.'},
{t:'Chase the Equilibrium',s:'Demand & Supply',e:'📈',c:'#3a8fd9',d:'Shift the right curve, then call the new price and quantity.'},
{t:'Price Is Right?',s:'Elasticity',e:'🏷️',c:'#1fa97a',d:'Run a stall for 5 days and find the revenue-maximising price.'},
{t:'Goods Detective',s:'Effects & Concepts',e:'🕵️',c:'#6db4ee',d:'Split price effects, detect the kind of good, match the examples.'},
{t:'Mystery Game',s:'Topic to be announced',e:'🔒',c:'#5b7799',d:'A new challenge is on its way. Check back for the next drop.'},
{t:'Mystery Game',s:'Topic to be announced',e:'🔒',c:'#5b7799',d:'A new challenge is on its way. Check back for the next drop.'}];
let rows=[],cur=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch(CFG.URL+'/rest/v1/scores?select=name,game,score,time_ms,created_at&limit=5000',{headers:{apikey:CFG.KEY}});const j=await r.json();if(!Array.isArray(j))throw (j.message||r.status);rows=j;note('')}catch(e){note('⚠️ Leaderboard unavailable: '+(e.message||e)+'. Run supabase.sql in Supabase.')}draw()}
function note(t){let n=$('#note');if(!n){n=document.createElement('div');n.id='note';n.style.cssText='background:#7a1f2e;color:#fff;padding:8px 5vw;font-size:.85rem';document.body.prepend(n)}n.textContent=t;n.style.display=t?'block':'none'}
function board(g){const m={};rows.forEach(r=>{if(g&&r.game!=g)return;const k=r.name.toLowerCase()+'|'+r.game,o=m[k];if(!o||r.score>o.score||(r.score==o.score&&r.time_ms<o.time_ms))m[k]=r});
const b=Object.values(m);if(g)return b.map(r=>({name:r.name,score:r.score,time:r.time_ms,at:r.created_at})).sort((a,c)=>c.score-a.score||a.time-c.time||a.at.localeCompare(c.at));
const t={};b.forEach(r=>{const k=r.name.toLowerCase();t[k]=t[k]||{name:r.name,score:0,time:0};t[k].score+=r.score;t[k].time+=r.time_ms});return Object.values(t).sort((a,c)=>c.score-a.score||a.time-c.time)}
function lb(g,n){const me=(localStorage.eq_name||'').toLowerCase();return `<ol class="lb">${board(g).slice(0,n).map((r,i)=>`<li class="${r.name.toLowerCase()==me?'me':''}"><span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span></li>`).join('')||'<li class="empty">No scores yet. Be the first!</li>'}</ol>`}
function draw(){const a=$('#lbHome');if(a)a.innerHTML=lb(0,15);const b=$('#lb');if(b)b.innerHTML=lb(cur,15);document.querySelectorAll('.bestline').forEach(e=>{const v=localStorage['eq_best_'+e.dataset.g];e.textContent=v?'Your best: '+v:''})}
function home(){cur=0;app.innerHTML=`<section class="hero"><h1>Think. Play. <span>Reach equilibrium.</span></h1><p>Fun economics games · unlimited tries · your best score counts · no login</p></section>
<section class="grid">${GAMES.map((g,i)=>{const n=i+1,ok=n<=CFG.OPEN_GAMES;return `<${ok?'a':'div'} class="card${ok?'':' locked'}" style="--c:${g.c}" ${ok?'href="#g'+n+'"':''}><div class="em">${g.e}</div><b>Game ${n}</b><h3>${g.t}</h3><i>${g.s}</i><p>${g.d}</p><div class="bestline" data-g="${n}"></div><span class="go">${ok?'Play →':'🔒 Coming soon'}</span></${ok?'a':'div'}>`}).join('')}</section>
<section class="panel"><h2>🏆 Overall leaderboard <small>sum of best scores · out of 4,000</small></h2><div id="lbHome"></div></section>`;draw()}
function game(n){cur=n;const g=GAMES[n-1];app.innerHTML=`<a class="back" href="#">← All games</a><div class="gwrap"><section class="panel play" style="--c:${g.c}"><h2>${g.e} ${g.t} <small>${g.s}</small></h2><div id="stage"></div><details class="rules"><summary>📖 Rules (open any time)</summary>${G[n].rules}</details></section><aside class="panel"><h2>🏆 ${g.t} <small>best scores</small></h2><div id="lb"></div></aside></div>`;draw();run(n)}
function run(n){clearTimers();const st=$('#stage'),g=G[n];st.innerHTML=`<div class="intro">${g.intro}<div class="rules"><h4>📖 Detailed rules</h4>${g.rules}</div><button id="go" class="btn">Start</button></div>`;$('#go').onclick=()=>{const t0=Date.now();st.innerHTML='';g.play(st,sc=>finish(n,sc,Date.now()-t0));topScroll(st)}}
const grade=s=>s>=900?'🏅 Brilliant!':s>=700?'🔥 Strong run':s>=450?'👍 Solid, try to beat it':'🌱 Keep practising';
function finish(n,sc,ms){clearTimers();sc=Math.round(Math.max(0,Math.min(1000,sc)));const k='eq_best_'+n;if(sc>(+localStorage[k]||0))localStorage[k]=sc;
$('#stage').innerHTML=`<div class="result"><div class="big">${sc}<small>/1000</small></div><p>${grade(sc)}</p><p class="mut">Time ${(ms/1000).toFixed(1)}s · only your best attempt counts</p><input id="nm" maxlength="24" placeholder="Your name (shown on leaderboard)" value="${esc(localStorage.eq_name||'')}"><div class="row" style="justify-content:center"><button id="sub" class="btn">Submit score</button><button id="again" class="btn ghost">Play again</button></div><p id="msg" class="mut"></p></div>`;
topScroll($('#stage'));$('#again').onclick=()=>{run(n);topScroll($('#stage'))};
$('#sub').onclick=async()=>{const nm=$('#nm').value.trim();if(!nm){$('#msg').textContent='Enter a name first.';return}localStorage.eq_name=nm;$('#sub').disabled=true;
try{const r=await fetch(CFG.URL+'/rest/v1/scores',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({name:nm,game:n,score:sc,time_ms:ms})});if(!r.ok)throw new Error(r.status+' '+(await r.text()));$('#msg').textContent='✅ Submitted! It shows on the leaderboard if it is your best.';$('#sub').remove();load()}catch(e){$('#msg').textContent='Could not submit: '+e.message;$('#sub').disabled=false}}}
function route(){clearTimers();scrollTo(0,0);const m=/^#g([1-6])$/.exec(location.hash);m&&+m[1]<=CFG.OPEN_GAMES?game(+m[1]):home()}
// Change CFG.RESET (e.g. 'v2') to wipe every player's saved 'Your best' scores on their next visit.
try{if(localStorage.eq_reset!==CFG.RESET){Object.keys(localStorage).filter(k=>k.startsWith('eq_best_')).forEach(k=>localStorage.removeItem(k));localStorage.eq_reset=CFG.RESET}}catch(e){}
onhashchange=route;route();load();setInterval(load,15000);

</script></body></html>
